name: CI
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libgtest-dev libbenchmark-dev libjemalloc-dev libmimalloc-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja googletest google-benchmark mimalloc jemalloc
      - name: Build and test
        env:
          CC: clang
          CXX: clang++
        run: make test
      - name: Benchmark smoke run
        run: make demo
      - name: LD_PRELOAD override smoke test
        if: runner.os == 'Linux'
        run: tests/override_smoke.sh build/libheapwise_override.so

  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: asan }
          - { os: ubuntu-latest, target: tsan }
          - { os: macos-latest, target: asan }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libgtest-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja googletest
      - name: ${{ matrix.target }}
        env:
          CC: clang
          CXX: clang++
        run: make ${{ matrix.target }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang clang-format clang-tidy libgtest-dev
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build -G Ninja -DHW_BUILD_BENCH=OFF
      - name: clang-format and clang-tidy
        run: make lint
